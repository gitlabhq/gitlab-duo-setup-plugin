# CI for the kit itself. The example project has its own .gitlab-ci.yml, used
# when you copy it into a demo project.

stages:
  - test

example-tests:
  stage: test
  image: python:3.12
  script:
    - cd examples/inventory
    - pip install -r requirements.txt
    - pytest -q

init-smoke:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git jq
  script:
    - bash tests/init-smoke.sh

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:v0.10.0
  script:
    - shellcheck setup/setup.sh tests/init-smoke.sh examples/inventory/demo/*.sh
