# Agent configuration for GitLab Duo flows that run in CI/CD
# (Code Review, Fix CI/CD Pipeline, Resolve SAST Vulnerability, ...).
#
# Read from the default branch only. Flows use this so they can install the
# project's dependencies and run its tests before proposing a fix.
# Reference: https://docs.gitlab.com/user/duo_agent_platform/flows/execution/agent-config-yaml/
#
# Security note: setup_script runs before the sandbox is applied and has access
# to the flow's tokens. Keep it to dependency installation, and protect
# .gitlab/duo with CODEOWNERS.

setup_script:
  - pip install -r requirements.txt

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip
