# Agent configuration for GitLab Duo flows that run in CI/CD
# (Code Review, Fix CI/CD Pipeline, Resolve SAST Vulnerability, ...).
#
# Read from the default branch only. Flows use it to install the project's
# dependencies so they can run the tests before proposing a fix.
# Reference: https://docs.gitlab.com/user/duo_agent_platform/flows/execution/agent-config-yaml/
#
# setup.sh init filled in setup_script from the files it found in the
# repository. Check it matches how your CI installs dependencies.
#
# Security: setup_script runs before the sandbox is applied and has access to
# the flow's tokens. Keep it to dependency installation; CODEOWNERS covers
# this file.

