# Merge requests that automatic Code Review should skip.
# A review can still be requested manually on any of these.
# Reference: https://docs.gitlab.com/user/duo_agent_platform/flows/foundational_flows/code_review/#exclude-merge-requests-for-a-project
#
# Fix-pipeline and vulnerability-resolution MRs are opened by Duo service
# accounts. Reviewing them again is usually noise; remove the `authors` rule
# if you want Duo to review Duo.

exclude:
  authors:
    - "duo-*"
  # Example: skip release branches.
  # target_branches:
  #   - "release/*"
